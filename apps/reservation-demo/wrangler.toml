name = "bani"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WHATSAPP_GRAPH_VERSION = "v25.0"
AI_PROVIDER = "google"
AI_MODEL = "gemini-3.1-flash-lite"
AI_MAX_RPM = "15"
AGENT_HISTORY_LIMIT = "20"
AGENT_HISTORY_MAX_AGE_HOURS = "6"
LOG_LEVEL = "info"
DEMO_ALLOWLIST = ""

[observability]
enabled = true

# ADR-004 A.4 — retire visit drafts past their 24h TTL.
[triggers]
crons = ["*/15 * * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e6db5b3fb93743f0b8281d2c95197214"
